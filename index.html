<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luna: Guardiã dos Céus</title>
<style>
:root{--pink:#ff4fa3;--gold:#ffd25e;--cyan:#5ef2ff}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1050;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;touch-action:none;user-select:none}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;pointer-events:none;font-weight:800;text-shadow:0 2px 12px #0008}
#score{font-size:30px;color:var(--gold);min-width:90px}#lives{font-size:26px;letter-spacing:3px;min-width:90px;text-align:right}
#mid{text-align:center;font-size:14px;opacity:.95}#bar{width:min(36vw,220px);height:8px;border-radius:8px;background:#0006;margin:6px auto 0;overflow:hidden}
#bi{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pink));transition:width .3s}
#bn{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:clamp(26px,6vw,54px);font-weight:900;pointer-events:none;opacity:0;text-shadow:0 4px 24px #000a}
#bn.s{animation:bn 3.2s ease}@keyframes bn{0%{opacity:0;transform:scale(.8)}15%,75%{opacity:1;transform:scale(1)}100%{opacity:0}}
#bn small{display:block;font-size:.4em;color:var(--gold);letter-spacing:3px}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;background:radial-gradient(circle,#2a105099,#120428e6);padding:20px;overflow:auto}
h1{font-size:clamp(34px,8vw,68px);margin:0 0 8px;background:linear-gradient(90deg,var(--gold),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 20px #ff4fa388)}
h2{font-size:clamp(24px,5vw,38px);margin:0 0 6px;color:var(--gold)}
p{max-width:480px;line-height:1.55;opacity:.95;margin:8px 0 14px;font-size:clamp(15px,3.6vw,19px)}
button{font:inherit;font-weight:800;font-size:18px;margin:5px;padding:12px 32px;border:0;border-radius:40px;color:#2a1050;background:linear-gradient(90deg,var(--gold),var(--pink));cursor:pointer;box-shadow:0 8px 26px #ff4fa366}
button:disabled{opacity:.3;cursor:default}
.g{display:grid;grid-template-columns:repeat(4,78px);gap:14px;justify-content:center;margin:12px 0 16px}.g button{width:78px;height:88px;padding:6px 0;margin:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:28px;line-height:1}.g button span{font-size:13px;letter-spacing:2px;font-weight:700}.g button:disabled{background:#ffffff1a;color:#fff6;box-shadow:none}
@media(max-width:400px){.g{grid-template-columns:repeat(3,78px)}}

.pt{width:120px;height:120px;flex:none;border-radius:50%;border:3px solid var(--gold);background:var(--luna) 45% 35%/260% no-repeat;position:relative;box-shadow:0 0 24px #ff4fa388;transition:filter .2s}
.pt::after{content:attr(data-e);position:absolute;top:-6px;right:-6px;min-width:28px;height:28px;line-height:28px;text-align:center;border-radius:14px;background:var(--pink);color:#fff;font-weight:900;font-size:16px;padding:0 4px;box-sizing:border-box}.pt[data-e='']::after{display:none}
.pt.big{width:150px;height:150px;margin-bottom:8px}
.pt.eh{filter:brightness(1.1) saturate(1.35);animation:hop .6s infinite alternate}
.pt.es{animation:shk .12s infinite}
.pt.ew{filter:saturate(.6) brightness(.9);transform:rotate(-6deg)}
.pt.ea{filter:sepia(.5) saturate(2.4) hue-rotate(-30deg) contrast(1.1);transform:scale(1.06)}
.pt.ed{filter:grayscale(.6) brightness(.8);transform:rotate(6deg)}
.pt.x{display:flex;align-items:center;justify-content:center;font-size:56px;background:#1a0a30}.pt.x::after{content:""}
@keyframes hop{to{transform:translateY(-6px)}}@keyframes shk{50%{transform:scale(1.1) translateX(3px)}}
#ov.dg{background:linear-gradient(transparent 50%,#120428cc);justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.dl{display:flex;gap:16px;align-items:center;background:#120428ee;border:2px solid #ffffff33;border-radius:20px;padding:16px 20px;max-width:640px;text-align:left}
.dl p{margin:4px 0 8px}.dl b{color:var(--gold)}
small{display:block;margin-top:10px;opacity:.7;font-size:12px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:420px;width:100%}.mg button{margin:0;padding:12px 8px;font-size:16px}
input{font:inherit;font-size:20px;padding:12px 18px;border-radius:30px;border:2px solid var(--gold);background:#0006;color:#fff;text-align:center;margin-bottom:10px;width:min(280px,70vw);user-select:text}
#ov.shp{background:linear-gradient(transparent 0,#120428e0 38%);justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.sh{display:flex;flex-direction:column;gap:6px;max-width:480px;width:100%;margin-bottom:8px;max-height:46vh;overflow:auto}
.sr{display:flex;align-items:center;gap:8px;background:#ffffff18;border-radius:14px;padding:8px 12px;text-align:left}.sr>div{flex:1}.sr button{padding:8px 14px;font-size:14px;margin:0}
.sr i{color:var(--gold);font-style:normal;font-weight:800}.sr small{margin:0;opacity:.8}
.lb{list-style:none;padding:0;margin:0 0 10px;width:100%;max-width:420px}.lb li{display:flex;gap:10px;background:#ffffff18;border-radius:12px;padding:8px 12px;margin:4px 0;text-align:left}.lb span{flex:1}.lb em{color:var(--gold);font-style:normal}
#ov.bk{background:#000;justify-content:center}
.sp{animation:sp 3.2s ease forwards}@keyframes sp{0%{opacity:0;transform:scale(.92)}22%,78%{opacity:1;transform:scale(1)}100%{opacity:0}}
.lg{font-size:44px;font-weight:900;letter-spacing:4px;padding:18px 26px;border:3px solid var(--gold);border-radius:14px;color:var(--gold);box-shadow:0 0 30px #ff4fa366;display:inline-block;margin-bottom:10px}.sp h2{letter-spacing:6px;font-size:clamp(24px,6vw,44px);margin:6px 0;text-transform:uppercase}
.ldb{width:min(260px,60vw);height:6px;background:#ffffff22;border-radius:6px;overflow:hidden;margin:14px 0 4px}.ldb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pink));animation:ld 2.4s linear forwards}@keyframes ld{to{width:100%}}
.wr{max-width:520px}
.mg.one{grid-template-columns:1fr;max-width:340px}.mg .w{grid-column:1/-1;font-size:22px;padding:14px}
.pt.x.c{background:radial-gradient(circle,#2a8aaa,#0a2a4a);font-size:34px;font-weight:900;color:#fff}.pt.x.e{background:radial-gradient(circle,#000 52%,#ffb04a 56%,#ff4fa3 68%,#1a0a30 72%)}
.stp{font-size:12px;letter-spacing:3px;opacity:.7;margin-bottom:6px}.ti{width:84px;height:84px;margin-bottom:6px;filter:drop-shadow(0 0 14px #ff4fa366)}
#pb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 52px);right:14px;width:42px;height:42px;padding:0;font-size:15px;border-radius:50%;margin:0;z-index:5}

pg:{st:['Long ago, the Star Crystal kept all the skies of the kingdom of Aurora in harmony: day, night, rain and snow.','But the Dark Eclipse shattered the crystal, and its 11 fragments of light scattered across the skies. Without them, the music of the world is fading.','You are Luna, the youngest pilot of Aurora. Cross the skies, gather the fragments and collect the parts that transform your ship.'],

cr:['Creator & Developer<br><b>Dragon</b><br><br>Studio<br><b>Dragon Slayer Studio</b><br><br>Thanks for playing!']},
